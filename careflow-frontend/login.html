<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>(function(){try{var t=JSON.parse(localStorage.getItem("careflow_theme"));if(t)document.documentElement.setAttribute("data-theme",t);}catch(e){}})();</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CareFlow AI - Login</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="components.css">
  <link rel="stylesheet" href="forms.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 40%, #1e1b4b 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: '';
      position: absolute;
      top: -50%;
      right: -30%;
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -40%;
      left: -20%;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(16,185,129,0.1) 0%, transparent 70%);
      border-radius: 50%;
      pointer-events: none;
    }
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      padding: 0 1rem;
    }
    .login-card {
      background: var(--surface-bg);
      border-radius: var(--radius-2xl);
      box-shadow: 0 25px 60px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    .login-card-header {
      background: linear-gradient(135deg, var(--color-primary-600), var(--color-primary-800));
      padding: 2rem 2rem 1.5rem;
      text-align: center;
      color: #ffffff;
    }
    .login-logo {
      width: 56px;
      height: 56px;
      border-radius: var(--radius-lg);
      background: rgba(255,255,255,0.2);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.75rem;
      margin: 0 auto 1rem;
    }
    .login-card-header h1 {
      color: #ffffff;
      font-size: 1.5rem;
      margin-bottom: 0.25rem;
    }
    .login-card-header p {
      opacity: 0.85;
      font-size: 0.85rem;
    }
    .login-card-body {
      padding: 2rem;
    }
    .login-error {
      background: #fef2f2;
      color: #dc2626;
      padding: 0.75rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.8rem;
      margin-bottom: 1rem;
      display: none;
      align-items: center;
      gap: 0.5rem;
    }
    .login-error.show {
      display: flex;
    }
    .demo-credentials {
      margin-top: 1rem;
      padding: 0.75rem;
      background: var(--color-primary-50);
      border-radius: var(--radius-md);
      font-size: 0.75rem;
      color: var(--color-primary-700);
      text-align: center;
    }
    [data-theme="dark"] .demo-credentials {
      background: rgba(99,102,241,0.15);
      color: #a5b4fc;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-card-header">
        <div class="login-logo">
          <i class="fa-solid fa-heart-pulse"></i>
        </div>
        <h1>CareFlow AI</h1>
        <p>AI-Powered Hospital Triage & Management</p>
      </div>
      <div class="login-card-body">
        <div class="login-error" id="loginError">
          <i class="fa-solid fa-circle-exclamation"></i>
          <span id="loginErrorMessage">Invalid credentials</span>
        </div>
        <form id="loginForm" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email Address</label>
            <div class="form-search">
              <i class="fa-solid fa-envelope search-icon"></i>
              <input type="email" class="form-input" id="email" placeholder="you@hospital.com" required autocomplete="email">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label" for="password">Password</label>
            <div class="form-search">
              <i class="fa-solid fa-lock search-icon"></i>
              <input type="password" class="form-input" id="password" placeholder="Enter your password" required autocomplete="current-password">
            </div>
          </div>
          <div class="form-check login-remember-row">
            <input type="checkbox" id="remember">
            <label for="remember">Remember me</label>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="loginBtn">
            <i class="fa-solid fa-right-to-bracket"></i> Sign In
          </button>
          <div class="login-forgot-wrap">
            <a href="#" class="login-forgot-link">Forgot your password?</a>
          </div>
        </form>
      </div>
    </div>
    <p class="login-footer">
      &copy; 2025 CareFlow AI. All rights reserved.
      <a href="server-setup.html" id="serverSettingsLink" class="login-settings-link" title="Server settings" aria-label="Server settings"><i class="fa-solid fa-gear"></i></a>
    </p>
  </div>

  <script src="server-config.js"></script>
  <script src="storage.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
<script src="permissions.js"></script>
  <script>
    (function() {
      // Native app, first run: no backend configured yet - send the
      // user to the connect screen before they can even try to sign in.
      if (ServerConfig.needsSetup()) {
        window.location.href = 'server-setup.html';
        return;
      }
      var form = document.getElementById('loginForm');
      var emailInput = document.getElementById('email');
      var passwordInput = document.getElementById('password');
      var rememberInput = document.getElementById('remember');
      var errorDiv = document.getElementById('loginError');
      var errorMsg = document.getElementById('loginErrorMessage');
      var loginBtn = document.getElementById('loginBtn');

      function showError(message) {
        errorMsg.textContent = message;
        errorDiv.classList.add('show');
        setTimeout(function() {
          errorDiv.classList.remove('show');
        }, 5000);
      }

      form.addEventListener('submit', function(e) {
        e.preventDefault();
        var email = emailInput.value.trim();
        var password = passwordInput.value.trim();

        if (!email) {
          showError('Please enter your email address.');
          emailInput.focus();
          return;
        }
        if (!password) {
          showError('Please enter your password.');
          passwordInput.focus();
          return;
        }

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

        // Set this before logging in so the token/session Auth.login is
        // about to save land in the right storage (see storage.js).
        Storage.setRememberMe(rememberInput && rememberInput.checked);

        Auth.login(email, password).then(function() {
            var redirect = new URLSearchParams(window.location.search).get('redirect');
            window.location.href = redirect || 'index.html';
        }).catch(function(error) {
            showError(error.message || 'Invalid email or password. Please try again.');
            loginBtn.disabled = false;
            loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign In';
            passwordInput.value = '';
            passwordInput.focus();
        });
      });

      if (Auth.isLoggedIn()) {
        window.location.href = 'index.html';
      }
    })();
  </script>
</body>
</html>
